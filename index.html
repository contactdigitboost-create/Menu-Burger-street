<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Burger Street</title>
  <meta name="description" content="Le menu de Burger Street : burgers, sandwichs, tacos, paninis, tex-mex, salades, pâtes, desserts et boissons.">
  <meta name="theme-color" content="#0e0d0c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ ACCUEIL ============ -->
  <section id="view-home" class="view hero" aria-labelledby="hero-title">
    <div class="hero-bg" aria-hidden="true"></div>

    <header class="hero-top">
      <span class="brand" data-brand></span>
    </header>

    <div class="hero-body">
      <h1 id="hero-title" class="hero-title">Découvrez <span>notre menu</span></h1>
      <div class="btn-wrap" id="btn-wrap">
        <a href="#menu" class="btn-menu" id="btn-menu">
          Menu
          <span class="btn-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </div>
    </div>

    <p class="hero-hint" data-restaurant="tagline"></p>
  </section>

  <!-- ============ MENU ============ -->
  <div id="view-menu" class="view menu-view" hidden>
    <header class="menu-head" id="menu-head">
      <div class="menu-bar">
        <a href="#" class="home-link" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span class="brand" data-brand></span>
        </a>
      </div>
      <nav class="cat-nav" id="cat-nav" aria-label="Catégories du menu"></nav>
    </header>

    <main class="menu" id="menu">
      <h1 class="visually-hidden" id="menu-title" tabindex="-1">Menu</h1>
      <div id="sections"></div>
      <p class="footnote" data-restaurant="footnote"></p>
    </main>
  </div>

  <noscript>
    <p class="noscript">Activez JavaScript pour afficher le menu.</p>
  </noscript>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
